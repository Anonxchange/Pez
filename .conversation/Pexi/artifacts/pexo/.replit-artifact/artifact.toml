kind = "web"
previewPath = "/"
title = "Pexly Marketplace"
description = "The Pexly public marketplace website imported from Anonxchange/Pexx, with the same shared header and navigation across its pages."
version = "1.0.0"
id = "artifacts/pexo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23600

[services.development]
run = "pnpm --filter @workspace/pexo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pexo", "run", "build" ]

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/pexo/scripts/serve.mjs" ]

[services.production.run.env]
PORT = "23600"
BASE_PATH = "/"
NODE_ENV = "production"

[services.env]
PORT = "23600"
BASE_PATH = "/"
